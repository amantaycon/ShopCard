server:
  port: 8088

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_password_secure_456
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Auth Service Route
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # Shop Service Route
        - id: shop-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/shops/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # Catalog Service Route
        - id: catalog-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # Inventory Service Route
        - id: inventory-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # Order Service Route
        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # Chat Service Route (HTTP and WebSocket routes)
        - id: chat-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/chats/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: chat-ws-route
          uri: ws://localhost:8087
          predicates:
            - Path=/ws/chat/**

        # Notification Service Route
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # Profile Service Public Route (No JwtAuthFilter)
        - id: profile-public-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/profiles/u/**
          filters:
            - StripPrefix=0

        # Profile Service Secure Route (With JwtAuthFilter)
        - id: profile-secure-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/profiles/my/**, /api/v1/profiles/{userId}
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

# JWT Secret config for gateway verification
jwt:
  secret: dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLWtleS1mb3Itand0LXNpZ25pbmctc2hvcGNhcmQtcHJvZHVjdGlvbi1ncmFkZS1zZWNyZXQ=

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
